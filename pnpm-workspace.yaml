packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  electron: true
  esbuild: true
  electron-winstaller: false
  msw: false
packageExtensions:
  # @hookform/resolvers@5.x imports `zod/v4/core` but does not declare zod as a
  # peer/dependency, so pnpm's isolated layout resolves it to a stray transitive
  # zod@3.x (no `./v4/core` export) and the Vite build fails. Pin it to zod 4.x.
  "@hookform/resolvers":
    dependencies:
      zod: "^4.4.3"
catalog:
  "@types/node": "^22.19.1"
  hono: "^4.12.22"
  pkgroll: "^2.27.0"
  react: "^19.2.1"
  react-dom: "^19.2.1"
  typescript: "^5.9.3"
  vite: "^7.2.6"
  vitest: "^4.1.7"
  zod: "^4.4.3"
