appId: com.openstyle.app
productName: Openstyle
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # A stray main bundle can appear at the app root (see .gitignore). Anchor the
  # pattern to the root: '!**/index.js' would also remove out/*/index.js.
  - '!index.js'
  # Build inputs and dev tooling, never loaded at runtime:
  #
  # - `native/**` — SwiftPM sources + the ~665 MiB `.build` directory of
  #   fluidaudio-diarize; shipped binaries resolve from `resources/bin` via
  #   the candidate lists in src/main/native-binary.ts (regression that
  #   tripled the macOS download in 2.1.1 — specs/lean-audit-2026-09.md §3 T0-1).
  # - `node_modules/**` — main and preload are self-contained bundles
  #   (externalizeDeps: false in electron.vite.config.ts) and the renderer is
  #   Vite-bundled, so nothing resolves a require() into node_modules. Keep the
  #   preload bundling and this exclusion in lockstep — a runtime
  #   require("@electron-toolkit/preload") would kill every window's window.api.
  # - tests/, scripts/, and tool configs — dev-only.
  - '!native/**'
  - '!node_modules/**'
  - '!tests/**'
  - '!test-results/**'
  - '!.turbo/**'
  - '!scripts/**'
  - '!{playwright.config.ts,vitest.config.ts,components.json}'
asarUnpack:
  - resources/**
extraResources:
  - from: "resources/bin/${platform}-${arch}"
    to: "bin"
    filter:
      - "**/*"
  - from: "resources/whisper/${platform}-${arch}"
    to: "whisper/${platform}-${arch}"
    filter:
      - "**/*"
win:
  executableName: Openstyle
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}-${version}-${arch}.${ext}
  extendInfo:
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSAppleEventsUsageDescription: Openstyle uses Apple Events to paste transcribed text into the focused application.
    NSAudioCaptureUsageDescription: Openstyle records system audio during meetings you choose to record.
  notarize: true
  extraResources:
    - from: "../../scripts/mlx_asr_server.py"
      to: "mlx-asr/mlx_asr_server.py"
    # Pre-bundled offline diarization models (specs/meeting-diarization.md
    # §4, amended 2026-08-25) — macOS-only, same as fluidaudio-diarize
    # itself (top-level extraResources' resources/bin/${platform}-${arch}).
    - from: "resources/models"
      to: "models"
      filter:
        - "**/*"
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  executableName: openstyle
  icon: icons
  desktop:
    entry:
      StartupWMClass: openstyle
  target:
    - AppImage
    - deb
  maintainer: Maheidem
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
deb:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: Maheidem
  repo: openstyle
