# Temporary (#313): read the Apple notarization status with the repo secrets.
# Remove before #313 merges.
name: Notary status
on:
  push:
    branches: [feat/developer-id-signing]
    paths: [.github/workflows/notary-status.yml]
  workflow_dispatch:
jobs:
  status:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Notarization history and submission status
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          (umask 077; printf '%s' "$APPLE_API_KEY_P8" > "$key")
          auth=(--key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          xcrun notarytool history "${auth[@]}"
          for id in bcbce16e-b467-4dfc-9962-0b9c5047ccd1; do
            xcrun notarytool info "$id" "${auth[@]}" || true
          done
          rm -f "$key"
