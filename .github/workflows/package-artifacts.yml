# Builds the npm tarball that Craft publishes for package releases.
#
# Triggered when `craft prepare` (release-package.yml) pushes a package release
# branch. Craft's npm target downloads the artifact uploaded here (named after
# the commit SHA, per Craft's GitHub artifact provider) and runs `npm publish`
# on it during the publish step.
#
# IMPORTANT: we use `pnpm pack` (not `npm pack`) so a `workspace:*`
# dependency is rewritten to a real version range in the published tarball.
# Plain `npm pack` does not understand the workspace: protocol.
#
# The release branch is release-<directory name>/<version>. The directory name
# picks packages/<directory name>. A branch with no .craft.yml there fails fast.

name: Package Artifacts
on:
  push:
    branches:
      - "release-*/**"

concurrency:
  group: package-artifacts-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    name: Build & pack package tarball
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Resolve package from branch
        id: pkg
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dir="${BRANCH#release-}"
          dir="${dir%%/*}"
          path="packages/$dir"
          if [[ ! -f "$path/.craft.yml" ]]; then
            echo "::error::No package mapping for branch $BRANCH"
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r .name "$path/package.json")" >> "$GITHUB_OUTPUT"

      - name: Build package (and its workspace deps)
        run: pnpm turbo build --filter ${{ steps.pkg.outputs.name }}

      - name: "Pack tarball (rewrites workspace: protocol)"
        working-directory: ${{ steps.pkg.outputs.path }}
        run: pnpm pack

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # Craft's GitHub artifact provider expects the artifact named after
          # the release-branch HEAD commit SHA.
          name: ${{ github.sha }}
          path: ${{ steps.pkg.outputs.path }}/*.tgz
          if-no-files-found: error
