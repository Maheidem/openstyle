# Build workflow: produces artifacts for Craft releases
# Triggered on push to main/release branches and PRs

name: Build & Test
on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      run_quality: ${{ steps.paths.outputs.run_quality }}
      run_electron: ${{ steps.paths.outputs.run_electron }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            {
              echo "run_quality=true"
              echo "run_electron=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...HEAD" > changed-files.txt

          run_quality=false
          run_electron=false

          echo "Changed files:"
          while IFS= read -r file; do
            echo "- $file"

            case "$file" in
              docs/*|apps/docs/*|*.md)
                ;;
              *)
                run_quality=true
                ;;
            esac

            case "$file" in
              apps/electron/*|apps/server/*|packages/*|scripts/*|.npmrc|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|turbo.json|.node-version|.github/actions/*|.github/workflows/build.yml)
                run_electron=true
                ;;
            esac

          done < changed-files.txt

          {
            echo "run_quality=$run_quality"
            echo "run_electron=$run_electron"
          } >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.run_quality == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Biome check
        run: pnpm biome check .

      # Isolation guard hook (.claude/settings.json PreToolUse): allow/block table.
      - name: Guard hook tests
        run: bash scripts/guard-hook.test.sh

  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Check unused files and dependencies
        run: pnpm run knip

  typecheck:
    name: Typecheck
    needs: [changes]
    if: needs.changes.outputs.run_electron == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build server (generates type declarations)
        run: pnpm turbo build --filter=@openstyle/server

      - name: Typecheck electron (web)
        working-directory: apps/electron
        run: pnpm run typecheck:web

      - name: Typecheck electron (tests)
        working-directory: apps/electron
        run: pnpm run typecheck:tests

  test-server:
    name: Test (Server API)
    needs: [changes]
    if: needs.changes.outputs.run_electron == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Run server tests
        # --expose-gc: the import memory-shape tests drive GC via
        # globalThis.gc() to separate "held" from "not yet collected" —
        # without it, CI runners' lazier V8 external-memory accounting
        # fails the assertions on garbage nothing references.
        env:
          NODE_OPTIONS: "--expose-gc"
        run: pnpm --filter @openstyle/server run test

      - name: Run stt package tests
        run: pnpm --filter @openstyle/stt run test

      - name: Run validations package tests
        run: pnpm --filter @openstyle/validations run test

  test-electron:
    name: Test (Electron E2E)
    needs: [changes, test-server]
    if: needs.changes.outputs.run_electron == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Install system dependencies
        # The apt step wedges on the runners often enough to matter, and with no
        # timeout it holds the job for the six-hour default instead of failing
        # where a re-run would clear it.
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y xvfb libglib2.0-0 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgtk-3-0 libgbm1 libasound2t64 libx11-xcb1 libx11-dev libxtst-dev libxext-dev libglib2.0-dev cmake libx11-xcb-dev

      - name: Build server
        run: pnpm turbo build --filter=@openstyle/server

      # The renderer tests import @openstyle/validations through its dist,
      # so they must run after the build step above.
      - name: Run Electron unit tests
        run: pnpm --filter @openstyle/electron run test

      - name: Build electron app
        working-directory: apps/electron
        run: pnpm run build

      - name: Verify electron build output
        run: test -f apps/electron/out/main/index.js

      # The app ships without node_modules (electron-builder.yml
      # !node_modules/**), so every require() in the built bundles must
      # resolve to Electron, a Node builtin, a relative chunk, or an
      # allowlisted external — anything else would be dead in the packaged
      # app. See apps/electron/scripts/check-bundled-requires.mjs.
      - name: Guard bundled require() surface
        working-directory: apps/electron
        run: node scripts/check-bundled-requires.mjs

      # Emitted renderer HTML must reference assets root-absolute (/assets/…).
      # electron-vite clobbers renderer base to './' in production; the
      # enforce:'post' rendererRootBaseUrl plugin in electron.vite.config.ts is
      # what restores '/' — if an upgrade defeats it, deep routes go blank with
      # no error and no failing test. See
      # apps/electron/scripts/check-renderer-asset-urls.mjs.
      - name: Guard root-absolute renderer asset URLs
        working-directory: apps/electron
        run: node scripts/check-renderer-asset-urls.mjs

      - name: Run Electron E2E tests
        timeout-minutes: 5
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" pnpm --filter @openstyle/electron run test:e2e

  build-linux:
    name: Build (Linux)
    needs: [changes, lint, typecheck, test-server]
    if: needs.changes.outputs.run_electron == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build server
        run: pnpm turbo build --filter=@openstyle/server

      - name: Install native build dependencies
        # See the note on the same step in test-electron.
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxext-dev libglib2.0-dev cmake libx11-xcb-dev binutils

      - name: Build whisper.cpp binaries
        working-directory: apps/electron
        run: node scripts/download-whisper-cpp.mjs --resources

      - name: Fetch/build ffmpeg
        working-directory: apps/electron
        run: node scripts/download-ffmpeg.mjs

      - name: Verify whisper binaries are portable (no AVX-512)
        working-directory: apps/electron
        run: node scripts/verify-whisper-portable.mjs

      - name: Build electron (Linux)
        working-directory: apps/electron
        run: pnpm run build:linux

      - name: Verify native binaries in package
        working-directory: apps/electron
        run: node scripts/verify-native-binaries.mjs

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            apps/electron/dist/*.AppImage
            apps/electron/dist/*.deb
            apps/electron/dist/latest*.yml
          if-no-files-found: error

  build-mac:
    name: Build (macOS)
    needs: [changes, lint, typecheck, test-server]
    if: needs.changes.outputs.run_electron == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          python-version: "3.12"

      - name: Build server
        run: pnpm turbo build --filter=@openstyle/server

      - name: Build MLX ASR worker archive
        run: ./scripts/build_mlx_asr_worker.sh

      - name: Verify MLX ASR worker archive exists
        run: test -f dist/mlx_asr_worker-darwin-arm64.tar.gz

      - name: Build whisper.cpp binaries
        working-directory: apps/electron
        run: node scripts/download-whisper-cpp.mjs --resources

      # No LGPL ffmpeg prebuilt exists for macOS, so download-ffmpeg.mjs
      # builds one from source (~5 min). Cache the finished binary keyed
      # on the pins inside the script so a re-run is a copy, not a build.
      - name: Cache built ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/.cache/freestyle/ffmpeg
          key: ${{ runner.os }}-${{ runner.arch }}-ffmpeg-${{ hashFiles('apps/electron/scripts/download-ffmpeg.mjs') }}

      - name: Fetch/build ffmpeg
        working-directory: apps/electron
        run: node scripts/download-ffmpeg.mjs

      # macos-14 runner images default to Xcode 15.4 (Swift 5.10), but
      # native/fluidaudio-diarize (specs/meeting-diarization.md §3) is a
      # SwiftPM package pinned to tools version 6.0 — `swift build` (invoked
      # from compile:native inside the "Build electron (macOS)" step below)
      # fails with "using Swift tools version 6.0.0 but the installed
      # version is 5.10.0" against the default toolchain. Select an Xcode
      # whose bundled Swift is >= 6.0 right before that step, so the
      # earlier steps above (server, MLX worker, whisper.cpp — none of
      # which touch Swift) keep building under the same toolchain 2.1.0
      # shipped with. 16.1 and 16.2 are the ones actually present on this
      # image (see https://github.com/actions/runner-images macos-14
      # readme — Xcode 16.2/16C5032a and 16.1/16B40 alongside the 15.4
      # default); 16.2 is picked as the newest, since image refreshes prune
      # older Xcodes first.
      - name: Select Xcode 16.2 (Swift 6 toolchain, for fluidaudio-diarize)
        run: |
          echo "Installed Xcode versions on this runner:"
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s /Applications/Xcode_16.2.app
          swift --version

      # Release signing (specs/under-the-hood.md, item 1, "Alternative").
      # When the secret MAC_RELEASE_CERT_P12 is set, this job signs the app
      # with the self-signed certificate "Openstyle Release". macOS keeps the
      # Privacy (TCC) permissions between two builds with the same identifier
      # and the same certificate. The owner creates the secrets once with
      # scripts/release-cert-setup.sh. When the secret is empty (forks, or
      # before the owner runs the script), this job keeps the ad-hoc build.
      # Not notarized in both cases: there is no Apple Developer account, and
      # empty CSC_LINK/APPLE_* secrets make electron-builder fail instead of
      # falling back.
      - name: Prepare release signing identity
        id: signing
        shell: bash
        env:
          RELEASE_CERT_P12: ${{ secrets.MAC_RELEASE_CERT_P12 }}
          RELEASE_CERT_PASSWORD: ${{ secrets.MAC_RELEASE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_CERT_P12" ]; then
            echo "::notice::MAC_RELEASE_CERT_P12 is empty. This build stays ad-hoc signed (no release signing)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$RELEASE_CERT_PASSWORD" ]; then
            echo "::error::MAC_RELEASE_CERT_P12 is set but MAC_RELEASE_CERT_PASSWORD is empty."
            exit 1
          fi

          dir="$RUNNER_TEMP/release-signing"
          kc="$dir/release-signing.keychain-db"
          mkdir -p "$dir"
          chmod 700 "$dir"
          printf '%s' "$RELEASE_CERT_P12" | base64 -D > "$dir/identity.p12"
          # Take the certificate out of the p12, for the trust setting.
          /usr/bin/openssl pkcs12 -in "$dir/identity.p12" \
            -passin env:RELEASE_CERT_PASSWORD -nokeys -clcerts 2>/dev/null |
            /usr/bin/openssl x509 -out "$dir/cert.pem"

          # Temporary keychain that holds the signing key for this job only.
          kc_pass="$(/usr/bin/openssl rand -hex 16)"
          echo "::add-mask::$kc_pass"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          security import "$dir/identity.p12" -k "$kc" -P "$RELEASE_CERT_PASSWORD" -T /usr/bin/codesign > /dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$kc" > /dev/null

          # Put the temporary keychain first in the search list, and make it the default.
          keychains=("$kc")
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line//\"/}"
            if [ -n "$line" ]; then keychains+=("$line"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          security default-keychain -d user -s "$kc"

          # A self-signed certificate is valid for code signing only when it is trusted.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$dir/cert.pem"

          security find-identity -v -p codesigning
          if ! security find-identity -v -p codesigning | grep -qF '"Openstyle Release"'; then
            echo "::error::The identity Openstyle Release is not valid after the import."
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # electron-builder 26 skips signing in pull request builds (it reads
      # GITHUB_BASE_REF) unless CSC_FOR_PULL_REQUEST is true. An empty value
      # also counts as true, so the variable is set only in the signed branch.
      # With an identity that it cannot find, electron-builder falls back to
      # ad-hoc for arm64 and does not fail. The step "Verify release
      # signature" below catches that case.
      - name: Build electron (macOS)
        working-directory: apps/electron
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            echo "Release signing path: identity Openstyle Release, notarization off."
            export CSC_FOR_PULL_REQUEST=true
            pnpm run build:mac -c.mac.identity="Openstyle Release" -c.mac.notarize=false
          else
            echo "Ad-hoc path: no release signing identity."
            pnpm run build:mac
          fi

      - name: Verify native binaries in package
        working-directory: apps/electron
        run: node scripts/verify-native-binaries.mjs

      - name: Verify release signature
        if: steps.signing.outputs.signed == 'true'
        working-directory: apps/electron
        shell: bash
        run: |
          set -euo pipefail
          app=""
          for candidate in dist/mac*/Openstyle.app; do
            app="$candidate"
            break
          done
          if [ ! -d "$app" ]; then
            echo "::error::No Openstyle.app found under dist/mac*."
            exit 1
          fi
          helper="$app/Contents/Resources/bin/macos-key-listener"
          for target in "$app" "$helper"; do
            echo "== codesign -dv --verbose=4 $target"
            details="$(codesign -dv --verbose=4 "$target" 2>&1)"
            echo "$details"
            if ! grep -qxF 'Authority=Openstyle Release' <<<"$details"; then
              echo "::error::$target is not signed by Openstyle Release."
              exit 1
            fi
            echo "== codesign -d -r- $target"
            requirement="$(codesign -d -r- "$target" 2>&1)"
            echo "$requirement"
            if ! grep -qF 'certificate leaf' <<<"$requirement"; then
              echo "::error::The designated requirement of $target has no certificate leaf."
              exit 1
            fi
          done

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-builds
          path: |
            dist/mlx_asr_worker-darwin-arm64.tar.gz
            apps/electron/dist/*.dmg
            apps/electron/dist/*.zip
            apps/electron/dist/latest*.yml
            apps/electron/dist/*.blockmap
          if-no-files-found: error

      - name: Remove release signing material
        if: always()
        shell: bash
        run: |
          dir="$RUNNER_TEMP/release-signing"
          if [ ! -d "$dir" ]; then
            echo "No release signing material on this runner."
            exit 0
          fi
          security delete-keychain "$dir/release-signing.keychain-db" || true
          if [ -f "$dir/cert.pem" ]; then
            sudo security remove-trusted-cert -d "$dir/cert.pem" || true
          fi
          rm -rf "$dir"

  build-windows:
    name: Build (Windows)
    needs: [changes, lint, typecheck, test-server]
    if: needs.changes.outputs.run_electron == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build server
        run: pnpm turbo build --filter=@openstyle/server

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download whisper.cpp binaries
        working-directory: apps/electron
        run: node scripts/download-whisper-cpp.mjs --resources

      - name: Fetch/build ffmpeg
        working-directory: apps/electron
        run: node scripts/download-ffmpeg.mjs

      - name: Build electron (Windows)
        working-directory: apps/electron
        run: pnpm run build:win

      - name: Verify native binaries in package
        working-directory: apps/electron
        run: node scripts/verify-native-binaries.mjs

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            apps/electron/dist/*.exe
            apps/electron/dist/latest*.yml
            apps/electron/dist/*.blockmap
          if-no-files-found: error

  ci-status:
    name: CI Status
    if: always()
    needs:
      - changes
      - lint
      - knip
      - typecheck
      - test-server
      - test-electron
      - build-linux
      - build-mac
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Check CI result
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "CI failed or was cancelled"
          exit 1
