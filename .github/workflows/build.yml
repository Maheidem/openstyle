# Build workflow: produces artifacts for Craft releases
# Triggered on push to main/release branches and PRs

name: Build & Test
on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      run_quality: ${{ steps.paths.outputs.run_quality }}
      run_electron: ${{ steps.paths.outputs.run_electron }}
      run_server_image: ${{ steps.paths.outputs.run_server_image }}
      run_plugins: ${{ steps.paths.outputs.run_plugins }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            {
              echo "run_quality=true"
              echo "run_electron=true"
              echo "run_server_image=true"
              echo "run_plugins=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...HEAD" > changed-files.txt

          run_quality=false
          run_electron=false
          run_server_image=false
          run_plugins=false

          echo "Changed files:"
          while IFS= read -r file; do
            echo "- $file"

            case "$file" in
              docs/*|apps/docs/*|*.md)
                ;;
              *)
                run_quality=true
                ;;
            esac

            case "$file" in
              apps/electron/*|apps/server/*|packages/*|scripts/*|.npmrc|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|turbo.json|.github/workflows/build.yml)
                run_electron=true
                ;;
            esac

            case "$file" in
              apps/server/*|packages/sdk/*|packages/stt/*|packages/utils/*|packages/validations/*|.npmrc|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|turbo.json|.github/workflows/build.yml)
                run_server_image=true
                ;;
            esac

            case "$file" in
              plugins/*|packages/sdk/*|.npmrc|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|turbo.json|.github/workflows/build.yml)
                run_plugins=true
                ;;
            esac

          done < changed-files.txt

          {
            echo "run_quality=$run_quality"
            echo "run_electron=$run_electron"
            echo "run_server_image=$run_server_image"
            echo "run_plugins=$run_plugins"
          } >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.run_quality == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm biome check .

  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Check unused files and dependencies
        run: pnpm run knip

  typecheck:
    name: Typecheck
    needs: [changes]
    if: needs.changes.outputs.run_electron == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build server (generates type declarations)
        run: pnpm turbo build --filter=@openstyle/server

      - name: Typecheck electron (web)
        working-directory: apps/electron
        run: pnpm run typecheck:web

  test-server:
    name: Test (Server API)
    needs: [changes]
    if: needs.changes.outputs.run_electron == 'true' || needs.changes.outputs.run_server_image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run server tests
        run: pnpm --filter @openstyle/server run test

  test-electron:
    name: Test (Electron E2E)
    needs: [changes, test-server]
    if: needs.changes.outputs.run_electron == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Install system dependencies
        # The apt step wedges on the runners often enough to matter, and with no
        # timeout it holds the job for the six-hour default instead of failing
        # where a re-run would clear it.
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y xvfb libglib2.0-0 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgtk-3-0 libgbm1 libasound2t64 libx11-xcb1 libx11-dev libxtst-dev libxext-dev libglib2.0-dev cmake libx11-xcb-dev

      - name: Build server
        run: pnpm turbo build --filter=@openstyle/server

      - name: Build electron app
        working-directory: apps/electron
        run: pnpm run build

      - name: Verify electron build output
        run: test -f apps/electron/out/main/index.js

      # The app ships without node_modules (electron-builder.yml
      # !node_modules/**), so every require() in the built bundles must
      # resolve to Electron, a Node builtin, a relative chunk, or an
      # allowlisted external — anything else would be dead in the packaged
      # app. See apps/electron/scripts/check-bundled-requires.mjs.
      - name: Guard bundled require() surface
        working-directory: apps/electron
        run: node scripts/check-bundled-requires.mjs

      - name: Run Electron E2E tests
        timeout-minutes: 5
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" pnpm --filter @openstyle/electron run test:e2e

  build-plugins:
    name: Build plugins
    needs: [changes, lint]
    if: needs.changes.outputs.run_plugins == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build plugin packages
        run: pnpm turbo build --filter=@openstyle/plugin-audio-transcription --filter=@openstyle/profanity-filter --filter=@openstyle/plugin-emoji

  build-linux:
    name: Build (Linux)
    needs: [changes, lint, typecheck, test-server]
    if: needs.changes.outputs.run_electron == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build server
        run: pnpm turbo build --filter=@openstyle/server

      - name: Install native build dependencies
        # See the note on the same step in test-electron.
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxext-dev libglib2.0-dev cmake libx11-xcb-dev binutils

      - name: Build whisper.cpp binaries
        working-directory: apps/electron
        run: node scripts/download-whisper-cpp.mjs --resources

      - name: Fetch/build ffmpeg
        working-directory: apps/electron
        run: node scripts/download-ffmpeg.mjs

      - name: Verify whisper binaries are portable (no AVX-512)
        working-directory: apps/electron
        run: node scripts/verify-whisper-portable.mjs

      - name: Build electron (Linux)
        working-directory: apps/electron
        run: pnpm run build:linux

      - name: Verify native binaries in package
        working-directory: apps/electron
        run: node scripts/verify-native-binaries.mjs

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            apps/electron/dist/*.AppImage
            apps/electron/dist/*.deb
            apps/electron/dist/latest*.yml
          if-no-files-found: error

  build-mac:
    name: Build (macOS)
    needs: [changes, lint, typecheck, test-server]
    if: needs.changes.outputs.run_electron == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile

      - name: Build server
        run: pnpm turbo build --filter=@openstyle/server

      - name: Build MLX ASR worker archive
        run: ./scripts/build_mlx_asr_worker.sh

      - name: Verify MLX ASR worker archive exists
        run: test -f dist/mlx_asr_worker-darwin-arm64.tar.gz

      - name: Build whisper.cpp binaries
        working-directory: apps/electron
        run: node scripts/download-whisper-cpp.mjs --resources

      # No LGPL ffmpeg prebuilt exists for macOS, so download-ffmpeg.mjs
      # builds one from source (~5 min). Cache the finished binary keyed
      # on the pins inside the script so a re-run is a copy, not a build.
      - name: Cache built ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/.cache/freestyle/ffmpeg
          key: ${{ runner.os }}-${{ runner.arch }}-ffmpeg-${{ hashFiles('apps/electron/scripts/download-ffmpeg.mjs') }}

      - name: Fetch/build ffmpeg
        working-directory: apps/electron
        run: node scripts/download-ffmpeg.mjs

      # macos-14 runner images default to Xcode 15.4 (Swift 5.10), but
      # native/fluidaudio-diarize (specs/meeting-diarization.md §3) is a
      # SwiftPM package pinned to tools version 6.0 — `swift build` (invoked
      # from compile:native inside the "Build electron (macOS)" step below)
      # fails with "using Swift tools version 6.0.0 but the installed
      # version is 5.10.0" against the default toolchain. Select an Xcode
      # whose bundled Swift is >= 6.0 right before that step, so the
      # earlier steps above (server, MLX worker, whisper.cpp — none of
      # which touch Swift) keep building under the same toolchain 2.1.0
      # shipped with. 16.1 and 16.2 are the ones actually present on this
      # image (see https://github.com/actions/runner-images macos-14
      # readme — Xcode 16.2/16C5032a and 16.1/16B40 alongside the 15.4
      # default); 16.2 is picked as the newest, since image refreshes prune
      # older Xcodes first.
      - name: Select Xcode 16.2 (Swift 6 toolchain, for fluidaudio-diarize)
        run: |
          echo "Installed Xcode versions on this runner:"
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s /Applications/Xcode_16.2.app
          swift --version

      # Ad-hoc signed, not notarized. There is no Apple Developer account
      # behind this fork, and passing empty CSC_LINK/APPLE_* secrets makes
      # electron-builder fail rather than fall back. What CI asserts here is
      # that the app packages cleanly on a clean machine.
      - name: Build electron (macOS)
        working-directory: apps/electron
        run: pnpm run build:mac

      - name: Verify native binaries in package
        working-directory: apps/electron
        run: node scripts/verify-native-binaries.mjs

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-builds
          path: |
            dist/mlx_asr_worker-darwin-arm64.tar.gz
            apps/electron/dist/*.dmg
            apps/electron/dist/*.zip
            apps/electron/dist/latest*.yml
            apps/electron/dist/*.blockmap
          if-no-files-found: error

  build-windows:
    name: Build (Windows)
    needs: [changes, lint, typecheck, test-server]
    if: needs.changes.outputs.run_electron == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build server
        run: pnpm turbo build --filter=@openstyle/server

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download whisper.cpp binaries
        working-directory: apps/electron
        run: node scripts/download-whisper-cpp.mjs --resources

      - name: Fetch/build ffmpeg
        working-directory: apps/electron
        run: node scripts/download-ffmpeg.mjs

      - name: Build electron (Windows)
        working-directory: apps/electron
        run: pnpm run build:win

      - name: Verify native binaries in package
        working-directory: apps/electron
        run: node scripts/verify-native-binaries.mjs

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            apps/electron/dist/*.exe
            apps/electron/dist/latest*.yml
            apps/electron/dist/*.blockmap
          if-no-files-found: error

  build-server-image:
    name: Build server image
    needs: [changes, lint, test-server]
    if: needs.changes.outputs.run_server_image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only authenticate + push on branch pushes (main / release/**).
      # PRs (incl. forks) build the image to validate the Dockerfile, no push.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/maheidem/openstyle-server
          # The release SHA tag is what the Craft docker target copies from.
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-status:
    name: CI Status
    if: always()
    needs:
      - changes
      - lint
      - knip
      - typecheck
      - test-server
      - test-electron
      - build-plugins
      - build-linux
      - build-mac
      - build-windows
      - build-server-image
    runs-on: ubuntu-latest
    steps:
      - name: Check CI result
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "CI failed or was cancelled"
          exit 1
