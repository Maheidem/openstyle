# Build workflow: checks every PR on the platform that ships (macOS), and
# produces the signed artifacts for Craft releases.
# - checks (Linux): lint, knip, types, unit tests, meeting eval checks.
# - app-macos (macos-14): electron unit tests, typecheck + bundle, E2E.
#   No xvfb and no apt. The Mac-only specs run here.
# - worker (macos-14): on release/** pushes, on a manual run with
#   package=true, or on a PR that changes the worker files.
# - package (macos-14): signs and notarizes. Only on release/** pushes and on
#   a manual run with package=true. A PR never runs it. Craft downloads the
#   "mac-builds" artifact of the release-branch run (.craft.yml).
# A push to main runs nothing here. cache-warm.yml saves the native-helper
# cache on main, so that PR runs can restore it.

name: Build & Test
on:
  push:
    branches:
      - "release/**"
  pull_request:
    branches: [main]
  # A full run on any branch, for example the pre-release check of the
  # release skill. package=false skips the signed build.
  workflow_dispatch:
    inputs:
      package:
        description: Also build, sign and notarize the macOS package
        type: boolean
        default: true

# A new push to a PR stops the old run. Release and manual runs finish.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.paths.outputs.code }}
      app: ${{ steps.paths.outputs.app }}
      worker: ${{ steps.paths.outputs.worker }}
      package: ${{ steps.paths.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: paths
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DISPATCH_PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          # $1 = worker and package. code and app are always on.
          full() {
            {
              echo "code=true"
              echo "app=true"
              echo "worker=$1"
              echo "package=$1"
            } >> "$GITHUB_OUTPUT"
          }

          case "$EVENT" in
            push)
              # Only release/** pushes start this workflow. Craft needs
              # mac-builds from this run.
              full true
              exit 0
              ;;
            workflow_dispatch)
              full "${DISPATCH_PACKAGE:-true}"
              exit 0
              ;;
          esac

          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...HEAD" > changed-files.txt

          # A PR never builds the package (owner decision 2026-10-27).
          code=false app=false worker=false
          echo "Changed files:"
          while IFS= read -r file; do
            echo "- $file"

            case "$file" in
              docs/*|apps/docs/*|*.md) ;;
              *) code=true ;;
            esac

            # What ships in the app. scripts/ holds eval tooling too, so only
            # the worker server script (packaged by electron-builder.yml) counts.
            case "$file" in
              apps/electron/*|apps/server/*|packages/*|scripts/mlx_asr_server.py|.npmrc|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|turbo.json|.node-version|.github/actions/*|.github/workflows/build.yml)
                app=true ;;
            esac

            case "$file" in
              scripts/build_mlx_asr_worker.sh|scripts/mlx_asr_server.py)
                worker=true ;;
            esac

          done < changed-files.txt

          {
            echo "code=$code"
            echo "app=$app"
            echo "worker=$worker"
            echo "package=false"
          } >> "$GITHUB_OUTPUT"

  # Lint, knip, server types and every unit test that needs no Electron.
  # One job: each old job spent ~15 s on setup and ~23 s on the same server build.
  checks:
    name: Checks (lint, types, unit)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Biome check
        run: pnpm biome check .

      - name: Check unused files and dependencies
        run: pnpm run knip

      # Isolation guard hook (.claude/settings.json PreToolUse): allow/block table.
      - name: Guard hook tests
        run: bash scripts/guard-hook.test.sh

      - name: Build server (and its workspace packages)
        run: pnpm turbo build --filter=@openstyle/server

      # The hard-fail checks of pnpm meeting:eval (fictional text only).
      - name: Meeting eval check tests
        run: pnpm meeting:eval:test

      - name: Typecheck server (tests)
        working-directory: apps/server
        run: pnpm run typecheck:tests

      - name: Run server tests
        # --expose-gc: the import memory-shape tests drive GC via
        # globalThis.gc() to separate "held" from "not yet collected".
        env:
          NODE_OPTIONS: "--expose-gc"
        run: pnpm --filter @openstyle/server run test

      - name: Run stt package tests
        run: pnpm --filter @openstyle/stt run test

      - name: Run validations package tests
        run: pnpm --filter @openstyle/validations run test

  # The app on the platform that ships. The electron "build" script runs
  # typecheck:node + typecheck:web + typecheck:tests before electron-vite
  # (apps/electron/package.json "build"), so no separate typecheck job.
  app-macos:
    name: Test (macOS app + E2E)
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build server
        run: pnpm turbo build --filter=@openstyle/server

      # The renderer tests import @openstyle/validations through its dist,
      # so they must run after the build step above.
      - name: Run Electron unit tests
        run: pnpm --filter @openstyle/electron run test

      # The Mac-only E2E specs drive the native helpers (for example
      # tests/hotkey-supervisor.test.ts needs macos-key-listener). The key
      # matches the compile:native inputs in turbo.json. compile:native also
      # fetches the diarization and VAD models into resources/models, so a
      # cache hit must restore them too (else the hit runs without VAD).
      # cache-warm.yml saves the same key and paths on main; keep both equal.
      - name: Cache native helpers
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            apps/electron/resources/bin/darwin-arm64
            apps/electron/resources/models
          key: ${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('apps/electron/native/**', 'apps/electron/scripts/compile-native.js') }}

      # native/fluidaudio-diarize needs Swift tools 6.0; macos-14 defaults to
      # Xcode 15.4 (Swift 5.10). See the package job for the full note.
      - name: Compile native helpers
        if: steps.native-cache.outputs.cache-hit != 'true'
        working-directory: apps/electron
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          pnpm run compile:native

      # Issue #170: --self-test sends synthetic buffers through the real
      # format and conversion code. It opens no device, mic or tap.
      - name: Self-test meeting capture helper
        working-directory: apps/electron
        run: |
          set -euo pipefail
          helper="resources/bin/darwin-$(node -p process.arch)/macos-meeting-capture"
          test -x "$helper"
          "$helper" --self-test

      - name: Typecheck and build electron app
        working-directory: apps/electron
        run: pnpm run build

      - name: Verify electron build output
        run: test -f apps/electron/out/main/index.js

      # See apps/electron/scripts/check-bundled-requires.mjs.
      - name: Guard bundled require() surface
        working-directory: apps/electron
        run: node scripts/check-bundled-requires.mjs

      # See apps/electron/scripts/check-renderer-asset-urls.mjs.
      - name: Guard root-absolute renderer asset URLs
        working-directory: apps/electron
        run: node scripts/check-renderer-asset-urls.mjs

      - name: Run Electron E2E tests
        timeout-minutes: 10
        run: pnpm --filter @openstyle/electron run test:e2e

      - name: Upload E2E traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: apps/electron/test-results
          retention-days: 7
          if-no-files-found: ignore

  # Builds the MLX ASR worker once, in parallel with the other jobs. The
  # package job takes the archive from this job.
  worker:
    name: Build MLX worker
    needs: [changes]
    if: needs.changes.outputs.worker == 'true'
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build MLX ASR worker archive
        run: ./scripts/build_mlx_asr_worker.sh

      - name: Verify MLX ASR worker archive exists
        run: test -f dist/mlx_asr_worker-darwin-arm64.tar.gz

      - name: Upload MLX ASR worker archive
        uses: actions/upload-artifact@v4
        with:
          name: mlx-worker
          path: dist/mlx_asr_worker-darwin-arm64.tar.gz
          retention-days: 7
          if-no-files-found: error

  package:
    name: Build (macOS)
    needs: [changes, worker]
    if: ${{ !cancelled() && needs.changes.outputs.package == 'true' && needs.worker.result == 'success' }}
    runs-on: macos-14
    # Notarization waits for Apple; the first submissions can take long.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build server
        run: pnpm turbo build --filter=@openstyle/server

      - name: Download MLX ASR worker archive
        uses: actions/download-artifact@v4
        with:
          name: mlx-worker
          path: dist

      - name: Verify MLX ASR worker archive exists
        run: test -f dist/mlx_asr_worker-darwin-arm64.tar.gz

      - name: Build whisper.cpp binaries
        working-directory: apps/electron
        run: node scripts/download-whisper-cpp.mjs --resources

      # No LGPL ffmpeg prebuilt exists for macOS, so download-ffmpeg.mjs
      # builds one from source (~5 min). Cache the finished binary keyed
      # on the pins inside the script so a re-run is a copy, not a build.
      - name: Cache built ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/.cache/freestyle/ffmpeg
          key: ${{ runner.os }}-${{ runner.arch }}-ffmpeg-${{ hashFiles('apps/electron/scripts/download-ffmpeg.mjs') }}

      - name: Fetch/build ffmpeg
        working-directory: apps/electron
        run: node scripts/download-ffmpeg.mjs

      # macos-14 runner images default to Xcode 15.4 (Swift 5.10), but
      # native/fluidaudio-diarize (specs/meeting-diarization.md §3) is a
      # SwiftPM package pinned to tools version 6.0 — `swift build` (invoked
      # from compile:native inside the "Build electron (macOS)" step below)
      # fails with "using Swift tools version 6.0.0 but the installed
      # version is 5.10.0" against the default toolchain. Select an Xcode
      # whose bundled Swift is >= 6.0 right before that step, so the
      # earlier steps above (server, MLX worker, whisper.cpp — none of
      # which touch Swift) keep building under the same toolchain 2.1.0
      # shipped with. 16.1 and 16.2 are the ones actually present on this
      # image (see https://github.com/actions/runner-images macos-14
      # readme — Xcode 16.2/16C5032a and 16.1/16B40 alongside the 15.4
      # default); 16.2 is picked as the newest, since image refreshes prune
      # older Xcodes first.
      - name: Select Xcode 16.2 (Swift 6 toolchain, for fluidaudio-diarize)
        run: |
          echo "Installed Xcode versions on this runner:"
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s /Applications/Xcode_16.2.app
          swift --version

      # Release signing (specs/under-the-hood.md, item 1; issues #53, #54).
      # The step picks one of three paths, in this order:
      #   1. devid: the secret MAC_DEVID_CERT_P12 is set. The job signs with
      #      the "Developer ID Application" identity, with the hardened
      #      runtime, and electron-builder notarizes and staples the app
      #      (App Store Connect API key: APPLE_API_KEY_P8, APPLE_API_KEY_ID,
      #      APPLE_API_ISSUER).
      #   2. self: MAC_DEVID_CERT_P12 is empty and MAC_RELEASE_CERT_P12 is set.
      #      The job signs with the self-signed certificate "Openstyle
      #      Release" (scripts/release-cert-setup.sh). Not notarized.
      #   3. adhoc: both secrets are empty (forks). The build stays ad-hoc.
      # macOS keeps the Privacy (TCC) permissions between two builds with the
      # same identifier and the same certificate. A change of path changes the
      # identity, so macOS asks for the permissions once more at that update.
      # No step prints a secret value.
      - name: Prepare release signing identity
        id: signing
        timeout-minutes: 5
        shell: bash
        env:
          DEVID_CERT_P12: ${{ secrets.MAC_DEVID_CERT_P12 }}
          DEVID_CERT_PASSWORD: ${{ secrets.MAC_DEVID_CERT_PASSWORD }}
          DEVID_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          DEVID_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          DEVID_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          RELEASE_CERT_P12: ${{ secrets.MAC_RELEASE_CERT_P12 }}
          RELEASE_CERT_PASSWORD: ${{ secrets.MAC_RELEASE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/release-signing"
          kc="$dir/release-signing.keychain-db"

          # Imports $1 (base64 PKCS#12) with password $2 into a temporary
          # keychain that holds the signing key for this job only.
          import_identity() {
            mkdir -p "$dir"
            chmod 700 "$dir"
            printf '%s' "$1" | base64 -D > "$dir/identity.p12"
            kc_pass="$(/usr/bin/openssl rand -hex 16)"
            echo "::add-mask::$kc_pass"
            security create-keychain -p "$kc_pass" "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p "$kc_pass" "$kc"
            security import "$dir/identity.p12" -k "$kc" -P "$2" -T /usr/bin/codesign > /dev/null
            security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$kc" > /dev/null

            # Put the temporary keychain first in the search list, and make it the default.
            keychains=("$kc")
            while IFS= read -r line; do
              line="${line#"${line%%[![:space:]]*}"}"
              line="${line//\"/}"
              if [ -n "$line" ]; then keychains+=("$line"); fi
            done < <(security list-keychains -d user)
            security list-keychains -d user -s "${keychains[@]}"
            security default-keychain -d user -s "$kc"
          }

          if [ -n "$DEVID_CERT_P12" ]; then
            missing=()
            [ -n "$DEVID_CERT_PASSWORD" ] || missing+=(MAC_DEVID_CERT_PASSWORD)
            [ -n "$DEVID_API_KEY_P8" ] || missing+=(APPLE_API_KEY_P8)
            [ -n "$DEVID_API_KEY_ID" ] || missing+=(APPLE_API_KEY_ID)
            [ -n "$DEVID_API_ISSUER" ] || missing+=(APPLE_API_ISSUER)
            if [ "${#missing[@]}" -gt 0 ]; then
              echo "::error::MAC_DEVID_CERT_P12 is set but these secrets are empty: ${missing[*]}."
              exit 1
            fi
            import_identity "$DEVID_CERT_P12" "$DEVID_CERT_PASSWORD"
            # The p12 often holds only the leaf certificate. Add the Apple
            # intermediate "Developer ID Certification Authority" (G2), so
            # that the identity is valid on the runner. An import of a
            # certificate that is already present fails, so it is not fatal.
            curl -fsSL --retry 3 --max-time 60 -o "$dir/DeveloperIDG2CA.cer" \
              https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
            security import "$dir/DeveloperIDG2CA.cer" -k "$kc" > /dev/null 2>&1 || true

            # notarytool reads the API key from a file.
            (umask 077 && printf '%s\n' "$DEVID_API_KEY_P8" > "$dir/AuthKey.p8")

            ids="$(security find-identity -v -p codesigning "$kc")"
            echo "$ids"
            hash="$(grep -F '"Developer ID Application: ' <<<"$ids" | head -n 1 | awk '{print $2}' || true)"
            if ! [[ "$hash" =~ ^[0-9A-F]{40}$ ]]; then
              echo "::error::No valid Developer ID Application identity after the import."
              exit 1
            fi
            {
              echo "mode=devid"
              echo "signed=true"
              echo "identity=$hash"
              echo "api_key_path=$dir/AuthKey.p8"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$RELEASE_CERT_P12" ]; then
            echo "::notice::MAC_DEVID_CERT_P12 and MAC_RELEASE_CERT_P12 are empty. This build stays ad-hoc signed (no release signing)."
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$RELEASE_CERT_PASSWORD" ]; then
            echo "::error::MAC_RELEASE_CERT_P12 is set but MAC_RELEASE_CERT_PASSWORD is empty."
            exit 1
          fi

          import_identity "$RELEASE_CERT_P12" "$RELEASE_CERT_PASSWORD"
          # Take the certificate out of the p12, for the trust setting.
          /usr/bin/openssl pkcs12 -in "$dir/identity.p12" \
            -passin env:RELEASE_CERT_PASSWORD -nokeys -clcerts |
            /usr/bin/openssl x509 -out "$dir/cert.pem"
          # A self-signed certificate is valid for code signing only when it is trusted.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$dir/cert.pem"

          ids="$(security find-identity -v -p codesigning)"
          echo "$ids"
          if ! grep -qF '"Openstyle Release"' <<<"$ids"; then
            echo "::error::The identity Openstyle Release is not valid after the import."
            exit 1
          fi
          echo "mode=self" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # electron-builder 26 skips signing in pull request builds (it reads
      # GITHUB_BASE_REF) unless CSC_FOR_PULL_REQUEST is true. An empty value
      # also counts as true, so the variable is set only in the signed paths.
      # With an identity that it cannot find, electron-builder falls back to
      # ad-hoc for arm64 and does not fail. The step "Verify release
      # signature" below catches that case.
      # mac.identity takes the SHA-1 hash: electron-builder refuses a name
      # that starts with "Developer ID Application:".
      # electron-builder notarizes when notarize is not false and APPLE_API_KEY,
      # APPLE_API_KEY_ID and APPLE_API_ISSUER are set. One of them set alone
      # makes it fail, so the APPLE_* variables exist only in the devid path.
      # It notarizes and staples the .app before it makes the dmg and the zip.
      - name: Build electron (macOS)
        working-directory: apps/electron
        env:
          # Progress lines for codesign and notarization (no secrets are printed).
          DEBUG: electron-osx-sign*,electron-notarize*,@electron/notarize*
          MODE: ${{ steps.signing.outputs.mode }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
          API_KEY_PATH: ${{ steps.signing.outputs.api_key_path }}
          DEVID_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          DEVID_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          case "$MODE" in
            devid)
              echo "Developer ID path: hardened runtime, notarization on."
              export CSC_FOR_PULL_REQUEST=true
              export APPLE_API_KEY="$API_KEY_PATH"
              export APPLE_API_KEY_ID="$DEVID_API_KEY_ID"
              export APPLE_API_ISSUER="$DEVID_API_ISSUER"
              pnpm run build:mac -c.mac.identity="$IDENTITY" -c.mac.hardenedRuntime=true -c.mac.notarize=true
              ;;
            self)
              echo "Release signing path: identity Openstyle Release, notarization off."
              export CSC_FOR_PULL_REQUEST=true
              pnpm run build:mac -c.mac.identity="Openstyle Release" -c.mac.notarize=false
              ;;
            *)
              echo "Ad-hoc path: no release signing identity."
              pnpm run build:mac
              ;;
          esac

      # Issue #170: the meeting helper converts the system audio at the rate
      # of the device. --self-test sends synthetic buffers through the real
      # format and conversion code. It opens no device, mic or tap, so it
      # needs no Privacy permission. A non-zero exit fails this job. The
      # binary comes from compile:native in the step above.
      - name: Self-test meeting capture helper
        working-directory: apps/electron
        shell: bash
        run: |
          set -euo pipefail
          helper="resources/bin/darwin-$(node -p process.arch)/macos-meeting-capture"
          test -x "$helper"
          "$helper" --self-test

      - name: Verify native binaries in package
        working-directory: apps/electron
        run: node scripts/verify-native-binaries.mjs

      # Meeting search (specs/local-semantic-search.md 11.2 step 4). The
      # step above checks that vec0.dylib is in the app. This step prints its
      # signature. The signed path also checks its authority below.
      - name: Check sqlite-vec dylib in package
        working-directory: apps/electron
        shell: bash
        run: |
          set -euo pipefail
          app=""
          for candidate in dist/mac*/Openstyle.app; do
            app="$candidate"
            break
          done
          dylib="$app/Contents/Resources/bin/vec0.dylib"
          test -f "$dylib"
          file "$dylib"
          codesign -dv "$dylib"

      # The checks live in scripts/verify-mac-signature.sh, which the local
      # release (scripts/release-local.sh) runs too. It checks every Mach-O
      # file under Contents/Resources plus the app, and in the devid path
      # Gatekeeper and the stapled ticket.
      - name: Verify release signature
        if: steps.signing.outputs.signed == 'true'
        working-directory: apps/electron
        shell: bash
        env:
          MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          app=""
          for candidate in dist/mac*/Openstyle.app; do
            app="$candidate"
            break
          done
          if [ ! -d "$app" ]; then
            echo "::error::No Openstyle.app found under dist/mac*."
            exit 1
          fi
          bash ../../scripts/verify-mac-signature.sh "$MODE" "$app" dist/*.dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-builds
          path: |
            dist/mlx_asr_worker-darwin-arm64.tar.gz
            apps/electron/dist/*.dmg
            apps/electron/dist/*.zip
            apps/electron/dist/latest*.yml
            apps/electron/dist/*.blockmap
          if-no-files-found: error

      - name: Remove release signing material
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        shell: bash
        run: |
          dir="$RUNNER_TEMP/release-signing"
          if [ ! -d "$dir" ]; then
            echo "No release signing material on this runner."
            exit 0
          fi
          # The directory holds the temporary keychain, the p12 and, in the
          # devid path, the API key file AuthKey.p8. All of it goes.
          # The runner is ephemeral, so the certificate trust is not removed here.
          # "sudo security remove-trusted-cert" waits for an authorization on a
          # headless runner and hangs the job.
          security delete-keychain "$dir/release-signing.keychain-db" || true
          rm -rf "$dir"

  # The only required check (ruleset 24718487 "main: PR + green CI").
  # A skipped job passes; a failed or cancelled job fails.
  ci-status:
    name: CI Status
    if: always()
    needs:
      - changes
      - checks
      - app-macos
      - worker
      - package
    runs-on: ubuntu-latest
    steps:
      # Pass only when each needed job is "success" or "skipped". Run
      # 40543620627 showed a gap: a macOS job that no runner acquired showed
      # "cancelled", but the old contains() test let CI Status pass.
      - name: Check CI result
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(" ")')"
          if [ -n "$bad" ]; then
            echo "::error::These jobs did not pass: $bad"
            exit 1
          fi
